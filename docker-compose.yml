services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: schoolsystem
      POSTGRES_USER: schoolsystem
      POSTGRES_PASSWORD: schoolsystem123
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/01_create_tables.sql:/docker-entrypoint-initdb.d/01_create_tables.sql
      - ./sql/02_insert_sample_data.sql:/docker-entrypoint-initdb.d/02_insert_sample_data.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schoolsystem -d schoolsystem"]
      interval: 5s
      timeout: 5s
      retries: 50

  app:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development

volumes:
  pgdata:
